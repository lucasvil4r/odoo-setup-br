# Demonstração de exemplo: oficina mecânica fictícia.
#
# Para montar a de um cliente, copie esta pasta para demo/<cliente>/, troque os
# dados e aponte DEMO_DADOS=<cliente> no .env. O catálogo fica em
# produtos.csv, os clientes e fornecedores em parceiros.csv (as duas abrem no
# Excel) e as fotos em fotos/.
#
# CNPJ, CPF e IE são inventados: só o dígito verificador é válido, para passar
# nas validações da localização. Nenhuma nota fiscal é emitida.

[empresa]
nome = "Auto Center Exemplo"
razao_social = "Auto Center Exemplo Serviços Automotivos Ltda"
cnpj = "10.433.218/0001-93"
ie = "526.018.151.907"
regime = "simples"           # único suportado pela demo
cnae = "4520-0/01"           # serviços de manutenção e reparação mecânica
natureza_juridica = "206-2"  # sociedade empresária limitada
documento_fiscal = "55"      # NF-e
telefone = "(11) 3456-7890"
email = "contato@autocenterexemplo.com.br"  # o domínio vira o dos usuários
site = "www.autocenterexemplo.com.br"
# logo = "logo.png"          # opcional, relativo a esta pasta
# cor_primaria = "#1f2a44"   # opcional, cores dos relatórios
# cor_secundaria = "#e30613"

[empresa.endereco]
rua = "Avenida dos Mecânicos"
numero = "1250"
bairro = "Vila Industrial"
cep = "03178-200"
cidade_ibge = "3550308"      # São Paulo/SP

[catalogo]
raiz = "Oficina"             # categoria que agrupa as da planilha

# Senha = login. Papéis: pdv, vendas, vendas_todas, estoque, compras
# (ou um xmlid de grupo do Odoo).
[[usuarios]]
nome = "Carla Souza (Balcão)"
login = "balcao"
papeis = ["pdv", "vendas", "estoque"]

[[usuarios]]
nome = "Rafael Lima (Consultor técnico)"
login = "consultor"
papeis = ["vendas_todas", "estoque", "compras"]

[pdv]
nome = "Balcão de Peças"
cabecalho = "Auto Center Exemplo\nMecânica em geral · Peças · Pneus"
rodape = "Garantia de 90 dias para serviços.\nDocumento sem valor fiscal (demonstração)."

# Compras, antes das vendas: a recebida dá entrada no estoque.
# situacao: cotacao | confirmada | recebida.  itens: [código, quantidade, preço]
[[compras]]
fornecedor = "F002"
situacao = "recebida"
itens = [["LUB-5W30", 24, 28.90], ["FLU-DOT4", 12, 17.80]]

[[compras]]
fornecedor = "F003"
situacao = "confirmada"
itens = [["PNE-18565", 8, 329.00]]

[[compras]]
fornecedor = "F001"
situacao = "cotacao"
itens = [["TRA-EMBR", 2, 420.00], ["MOT-BOMB", 3, 115.00]]

# Ordens de serviço (pedidos de venda). Placa e veículo vão na referência.
# situacao: rascunho | enviado | confirmado | entregue.  itens: [código, quantidade]
[[vendas]]
cliente = "C001"
vendedor = "consultor"
