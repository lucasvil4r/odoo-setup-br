dias_atras = 18
situacao = "entregue"
itens = [["LUB-15W40", 4], ["FIL-OLEO", 1], ["SRV-OLEO", 1]]
observacao = "Troca de óleo com 60.120 km. Próxima troca: 70.000 km."

