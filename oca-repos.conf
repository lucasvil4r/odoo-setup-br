# Repositórios OCA que compõem a localização fiscal brasileira e a interface.
#
# Formato:  <nome-do-diretorio> <url> <branch> <commit>
#
# O commit é o que garante que dois clientes forkados em momentos diferentes
# rodem exatamente o mesmo código. Atualizar é uma decisão consciente:
#   ./scripts/fetch-oca.sh --check-updates   mostra o que mudou no branch
#   ./scripts/fetch-oca.sh --update <nome>   move o pin para o HEAD do branch
#   ./scripts/fetch-oca.sh --verify          confere que cada pin é do branch
#
# Só l10n-brazil é a localização em si. Os outros quatro entram porque
# l10n_br_fiscal e l10n_br_stock_account dependem deles — a OCA distribui
# essas dependências em repositórios separados. Antes de adicionar um
# repositório novo aqui, rode `make deps` para confirmar que ele é mesmo
# necessário e que não falta nenhum outro.
#
# web não é dependência da localização: entra pela interface. O Community não
# tem a tela inicial com ícones do Enterprise e, desde a v17, esconde a borda
# dos campos — web_responsive e web_theme_classic resolvem as duas coisas.

