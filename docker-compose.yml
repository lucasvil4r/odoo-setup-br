# Valores vêm do .env (veja .env.example). Trocar PROJECT isola containers,
# volumes e banco — dois clientes podem rodar lado a lado na mesma máquina,
# desde que ODOO_PORT e DB_PORT sejam diferentes.

name: ${PROJECT}

services:
  db:
    image: postgres:15
    container_name: ${PROJECT}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Só em 127.0.0.1: acesso por DBeaver/psql da própria máquina, nunca da rede.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build: .
    image: odoo18-br:latest
    container_name: ${PROJECT}_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]

volumes:
  db_data:
  odoo_data:
